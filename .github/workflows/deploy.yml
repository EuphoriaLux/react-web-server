name: Build and deploy CoParents
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coparents-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build production or PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            npm run build -- --base="/previews/pr-$PR_NUMBER/"
          else
            npm run build
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website
          path: dist/
          if-no-files-found: error
          retention-days: 7
  api-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/cptest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet psycopg2-binary
      - name: Apply schema
        run: |
          for file in schema accounts receipts; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "db/$file.sql"
          done
      - run: python3 -m unittest -v server/test_api.py
  # Updates the API on the VM when a push to main changes server/api.py or db/.
  # Runs before the website deploy, because a new web app may need the new API.
  # Its key lives in the api-production environment, which only main can use.
  api-deploy:
    needs: [build, api-test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: api-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for API or database changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: updating the API."
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || \
               ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare with: updating the API."
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- server/api.py db/ | grep -q .; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" -- server/api.py db/
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "No API or database changes in this push."
            echo "api=false" >> "$GITHUB_OUTPUT"
            printf '### API unchanged\n\nNo changes in server/api.py or db/.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update the API on the server
        if: steps.changes.outputs.api == 'true'
        env:
          SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Set up API deploys once: bash scripts/setup-api-deploy.sh in Cloud Shell (docs/github-actions.md)}"
          : "${KNOWN_HOSTS:?Set up API deploys once: bash scripts/setup-api-deploy.sh in Cloud Shell}"
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in GitHub Actions variables}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/api_key' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/api_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/api_key ~/.ssh/known_hosts
          tar -czf api.tgz server/api.py db/*.sql
          # The server's forced command applies the SQL, restarts the API, checks
          # its health and exits non-zero (failing this job) if anything goes wrong.
          ssh -i ~/.ssh/api_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "coparents-api-deploy@$DEPLOY_HOST" < api.tgz | tee api-update.log
          grep -qx 'Database tables and API updated.' api-update.log
          curl --fail --silent --show-error --retry 3 --max-time 20 https://coparent.lu/api/health
          printf '### API updated\n\nCommit %s is live at https://coparent.lu/api/health\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: [build, api-test, api-deploy]
    # Runs after api-deploy succeeds, or when it is skipped (PRs, other branches).
    if: >-
      !cancelled() &&
      needs.build.result == 'success' && needs.api-test.result == 'success' &&
      (needs.api-deploy.result == 'success' || needs.api-deploy.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website
          path: dist
      - name: Deploy built static files
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Set DEPLOY_SSH_KEY in GitHub Actions secrets}"
          : "${KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in GitHub Actions secrets}"
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in GitHub Actions variables}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          TARGET=production
          URL="http://$DEPLOY_HOST/"
          if [ -n "$PR_NUMBER" ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            TARGET="pr-$PR_NUMBER"
            URL="http://$DEPLOY_HOST/previews/$TARGET/"
          fi
          echo "=== Deploy log ==="
          echo "Target: $TARGET"
          echo "URL: $URL"
          echo "Host: $DEPLOY_HOST"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tar -czf site.tgz -C dist index.html assets
          echo "Archive size: $(du -h site.tgz | cut -f1)"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "cloudmargin-deploy@$DEPLOY_HOST" "deploy $TARGET" < site.tgz
          curl --fail --silent --show-error --retry 3 --max-time 20 "$URL" | grep -qiE 'CoParents|co-parenting'
          printf '### Deployment successful\n\n[%s](%s)\n' "$URL" "$URL" >> "$GITHUB_STEP_SUMMARY"
  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove closed PR preview
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "cloudmargin-deploy@$DEPLOY_HOST" "remove pr-$PR_NUMBER"
